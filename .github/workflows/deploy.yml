name: Build and deploy Mars CV

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Blazor WebAssembly (portable static)
        run: dotnet publish -c Release -o publish
      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: wwwroot
          path: publish/wwwroot

  deploy-azure-static-web-apps:
    needs: build
    if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wwwroot
          path: publish/wwwroot
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          output_location: ""
          skip_app_build: true

  # --- Fallback: Cloudflare Pages ---
  # Используйте Wrangler (secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID):
  #   npx wrangler pages deploy publish/wwwroot --project-name mars-cv
  #
  # --- Fallback: Yandex Cloud Object Storage ---
  #   aws s3 sync publish/wwwroot s3://<bucket> --endpoint-url https://storage.yandexcloud.net --delete
  #   (обязательно настроить раздачу статики и fallback на index.html)
